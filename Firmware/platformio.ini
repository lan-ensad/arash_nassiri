; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    makuna/NeoPixelBus @ ^2.7.9

; --- Variante OTA (flash sans fil via ArduinoOTA) ---
; Premier flash obligatoire en USB avec l'env ci-dessus pour embarquer
; ArduinoOTA dans le firmware. Ensuite :
;   pio run -e seeed_xiao_esp32c6_ota -t upload
; L'IP doit correspondre a LOCAL_IP_BYTES dans src/wifi_config.h.
[env:seeed_xiao_esp32c6_ota]
extends = env:seeed_xiao_esp32c6
upload_protocol = espota
upload_port = 192.168.8.50
; --host_ip = IP de la machine sur le subnet de l'ESP32 (192.168.8.x).
; Necessaire si la machine a plusieurs interfaces (Wi-Fi + docker0 + ...) :
; sans pin, espota peut annoncer une IP non routable depuis l'ESP32.
upload_flags =
    --auth=ambilight
    --host_ip=192.168.8.202
